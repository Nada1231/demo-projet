<h2 class="title">Liste des suggestions</h2>

<input
  type="text"
  class="search-input"
  placeholder="Rechercher une suggestion (titre ou catégorie)"
  [(ngModel)]="searchText"
/>

<div *ngFor="let s of filteredSuggestions" class="suggestion-card">

  <div class="card-header">
    <h3>{{ s.title }}</h3>
    <span class="badge category">{{ s.category }}</span>
  </div>

  <p class="description">{{ s.description }}</p>

  <p class="meta">
    <span><strong>Date :</strong> {{ s.date | date:'dd/MM/yyyy' }}</span>
    <span
      class="badge"
      [ngClass]="{
        'accepted': s.status === 'acceptee',
        'refused': s.status === 'refusee',
        'pending': s.status === 'en_attente'
      }"
    >
      {{ s.status }}
    </span>
  </p>

  <p class="likes">
    👍 Likes : {{ s.nbLikes }}
  </p>

  <div class="actions" *ngIf="s.status !== 'refusee'">
    <button class="btn like" (click)="likeSuggestion(s)">
      👍 Like
    </button>

    <button class="btn fav" (click)="addToFavorites(s)">
      ⭐ Ajouter aux favoris
    </button>
  </div>

</div>
