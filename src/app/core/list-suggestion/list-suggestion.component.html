<h2>Liste des suggestions</h2>

<div *ngFor="let s of suggestions" class="suggestion-card">

  <h3>{{ s.title }}</h3>
  <p>{{ s.description }}</p>
  <p><strong>Catégorie :</strong> {{ s.category }}</p>
  <p><strong>Likes :</strong> {{ s.nbLikes }}</p>
  <p><strong>Statut :</strong> {{ s.status }}</p>

  <!-- Boutons visibles seulement si la suggestion n'est pas refusée -->
  <div *ngIf="s.status !== 'refusee'">
    <button (click)="likeSuggestion(s)">
      👍 Like
    </button>

    <button (click)="addToFavorites(s)">
      ⭐ Ajouter aux favoris
    </button>
  </div>

  <hr>
</div>
